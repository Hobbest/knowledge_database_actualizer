[project]
name = "knowledge-database-actualizer"
version = "0.1.0"
description = "Judge whether knowledge sources contain new information relative to an Obsidian vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-frontmatter==1.3.0",
    "pyyaml==6.0.3",
    "sentence-transformers==5.6.0",
    "chromadb==1.5.9",
    "protobuf==7.35.1",
    "networkx==3.4.2",
    "youtube-transcript-api==1.2.4",
    "yt-dlp==2026.6.9",
    "trafilatura==2.1.0",
    "pypdf==6.14.2",
    "pdfplumber==0.11.10",
    "EbookLib==0.18",
    "mammoth==1.8.0",
    "openai==2.44.0",
    "anthropic==0.112.0",
    "google-genai==2.11.0",
    "watchdog==6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "ruff==0.14.10",
    "mypy==1.19.1",
    "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
actualizer = "app.main:run"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B023", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["app.llm", "app.embeddings", "app.vectorstore"]
disable_error_code = ["arg-type"]
